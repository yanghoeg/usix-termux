[package]
name = "usix-code"
version = "0.0.1"
edition = "2021"
description = "A fully local coding and automation harness for Linux and Termux"
repository = "https://github.com/yanghoeg/usix-code"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
libc = "0.2"
# Inference uses loopback HTTP; downloads are handled separately during setup.
ureq = { version = "2", default-features = false, features = ["json"] }
# TUI — usix와 동일 스택
crossterm = "0.28"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
# 커서 위치·wrap 의 CJK(2셀) 폭 정확 계산 — usix draw.rs 와 동일 근거
unicode-width = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
