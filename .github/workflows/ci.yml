name: Native harness checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: python3 tests/architecture.py
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: python3 tests/install_smoke.py
      - run: sh install.sh --prefix "$RUNNER_TEMP/usix-code"
      - run: '"$RUNNER_TEMP/usix-code/bin/usix-code" --version'
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - run: cargo check --locked --target aarch64-linux-android
      - name: Link native Android executable with the installed NDK
        shell: bash
        run: |
          ndk="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          linker="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang"
          test -x "$linker"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$linker"
          cargo build --locked --target aarch64-linux-android
